services:
  web:
    image: andoerga/andoergaukpb:apache

    container_name: andoergaukpb

    ports:
      - "8080:80"

    env_file:
      - ../.env

    environment:
      - TZ=Asia/Jakarta

    volumes:
      - ./:/var/www/html
      - ../_setting.json:/var/www/_setting.json
      - C:/xampp/htdocs/andoergaukpb-storage/assets:/var/www/html/assets
      - C:/xampp/htdocs/andoergaukpb-storage/uploads:/var/www/html/uploads
      - ../.env:/var/www/html/.env

    restart: unless-stopped